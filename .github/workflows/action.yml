name: Auto Update rubrypass Files

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r rare.txt
      
      - name: Install WireGuard and wgcf (Cloudflare WARP)
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard resolvconf
          sudo wget -O /usr/local/bin/wgcf https://github.com/ViRb3/wgcf/releases/download/v2.3.1/wgcf_2.3.1_linux_amd64
          sudo chmod +x /usr/local/bin/wgcf

      - name: Connect Cloudflare WARP
        run: |
          # Free WARP account register karein
          wgcf register --accept-tos
          # Profile generate karein
          wgcf generate
          # WireGuard tunnel on karein
          sudo wg-quick up ./wgcf-profile.conf
          # Check karein ke WARP on ho gaya
          curl -s https://www.cloudflare.com/cdn-cgi/trace | grep warp

      - name: Run Script
        run: |
          curl -L -o rubrypass.py ${{ secrets.RUBRYPASS_SCRIPT }}
          python rubrypass.py

      - name: Changes ko commit karen
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git remote set-url origin https://${{ secrets.GITHUB_TOKEN }}@github.com/abidprobook/RubryPass.git
      
      - name: Commit and push changes
        run: |
          git add rugbypass.txt rugbypass_json.txt
          git fetch origin main
          git reset --soft origin/main
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fetch rubrypass latest data new"
            git push origin main
          fi
      
